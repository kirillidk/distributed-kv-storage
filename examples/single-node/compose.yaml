services:
  node-1:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: node
    image: distributed-kv-storage-node:local
    command:
      - --manifest
      - /etc/distributed-kv/cluster.yaml
      - --node-id
      - node-1
    volumes:
      - ./cluster.yaml:/etc/distributed-kv/cluster.yaml:ro
      - node-logs:/var/log/distributed-kv
      - node-1-wal:/var/lib/repl
    ports:
      - "7001:7001"
      - "8001:8001"
      - "2112:2112"
    stop_grace_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    depends_on:
      - node-1
    stop_grace_period: 10s

  clusterstat:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: clusterstat
    image: distributed-kv-storage-clusterstat:local
    command:
      - --manifest
      - /etc/distributed-kv/cluster.yaml
      - --listen
      - 0.0.0.0:8080
      - --prometheus-url
      - http://prometheus:9090
    volumes:
      - ./cluster.yaml:/etc/distributed-kv/cluster.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      - node-1
      - prometheus
    stop_grace_period: 10s

volumes:
  node-logs:
  node-1-wal:
  prometheus-data: