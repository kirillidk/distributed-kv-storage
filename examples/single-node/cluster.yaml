version: 1
cluster_id: demo

nodes:
  - id: node-1
    repl:
      listen_addr: 0.0.0.0:7001
      connect_addr: node-1:7001
      log_dir: /var/log/distributed-kv/node-1

shards:
  - id: shard-a
    replicas:
      - node_id: node-1
        data_dir: /var/lib/repl/shard-a
        engine:
          connect_addr: node-1:8001
          command: [/usr/local/bin/kv-engine, --port, "8001", --metrics-listen, "0.0.0.0:2112"]
          restart_delay: 3s
          shutdown_timeout: 5s
