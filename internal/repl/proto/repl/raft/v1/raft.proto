syntax = "proto3";

package repl.raft.v1;

option go_package = "github.com/kirillidk/distributed-kv-storage/internal/repl/gen/go/repl/raft/v1;raftv1";

// RaftService is the internal protocol between the manifest's repl nodes.
service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  // Raft indexes count records, independently of engine byte offsets.
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message LogEntry {
  uint64 term = 1;
  bytes payload = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  // Entries immediately following prev_log_index; empty for a heartbeat.
  repeated LogEntry entries = 5;
  // Committed Raft record index, not an engine byte offset.
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  // True only after the matching prefix, including entries, is durable.
  bool success = 2;
}
