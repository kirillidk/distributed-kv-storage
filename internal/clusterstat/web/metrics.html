<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>Cluster Metrics</title>

        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

        <style>
            :root {
            --bg: #0f1419; --card: #1a2332; --border: #2d3a4f;
            --text: #e7ecf3; --muted: #8b9bb4; --link: #7eb8ff;
            --up: #3dd68c; --down: #f07178;
            }
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
            font-family: ui-monospace, "Cascadia Code", "Fira Code", monospace;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 2rem;
            }
            a { color: var(--link); text-decoration: none; }
            a:hover { text-decoration: underline; }
            h1 { font-size: 1.3rem; margin: 0.5rem 0 1rem; }
            .bar {
            display: flex; flex-wrap: wrap; gap: 1rem; align-items: center;
            margin-bottom: 1rem; color: var(--muted); font-size: 0.85rem;
            }
            label { display: flex; flex-direction: column; gap: 0.25rem; }
            select, button {
            background: var(--card); color: var(--text);
            border: 1px solid var(--border); border-radius: 6px;
            padding: 0.4rem 0.6rem; font: inherit;
            }
            button { cursor: pointer; }
            button:hover { border-color: var(--link); }
            .status { padding: 0.5rem 0.75rem; border-radius: 8px; border: 1px solid var(--border); }
            .status.ok { border-color: var(--up); color: var(--up); }
            .status.err { border-color: var(--down); color: var(--down); }
            .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1rem;
            }
            .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; padding: 1rem;
            }
            .card h2 { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; text-transform: uppercase; }
            canvas { width: 100% !important; max-height: 220px; }
            .footer { margin-top: 1.5rem; color: var(--muted); font-size: 0.8rem; }
        </style>
    </head>

    <body>
        <p><a href="/">← back to cluster</a></p>

        <h1>Metrics</h1>

        <div class="bar">
            <label>Node
                <select id="node"></select>
            </label>

            <label>Method
                <select id="method">
                    <option value="">all</option>
                    <option>Get</option>
                    <option>Set</option>
                    <option>Delete</option>
                    <option>Add</option>
                    <option>Replace</option>
                    <option>Incr</option>
                    <option>Decr</option>
                </select>
            </label>

            <label>Range
                <select id="range">
                    <option value="900">15m</option>
                    <option value="3600" selected>1h</option>
                    <option value="21600">6h</option>
                </select>
            </label>

            <button type="button" id="refresh">Refresh</button>

            <span id="prom-status" class="status">checking…</span>
        </div>

        <div class="grid">
            <div class="card"><h2>RPS (requests / s)</h2><canvas id="chart-rps"></canvas></div>
            <div class="card"><h2>Latency p50 / p95 / p99 (s)</h2><canvas id="chart-lat"></canvas></div>
            <div class="card"><h2>Get hit / miss (rate)</h2><canvas id="chart-hit"></canvas></div>
            <div class="card"><h2>applied offset</h2><canvas id="chart-offset"></canvas></div>
            <div class="card"><h2>entries count</h2><canvas id="chart-entries"></canvas></div>
            <div class="card"><h2>goroutines</h2><canvas id="chart-go"></canvas></div>
        </div>

        <p class="footer">Data via clusterstat → Prometheus. Auto-refresh 15s. Last error kept charts if any.</p>

        <script>
            const charts = {};
            let lastSeries = {};
            
            function chartOpts() {
                return {
                    responsive: true,
                    animation: false,
                    scales: {
                        x: { ticks: { color: '#8b9bb4', maxTicksLimit: 6 }, grid: { color: '#2d3a4f' } },
                        y: { ticks: { color: '#8b9bb4' }, grid: { color: '#2d3a4f' }, beginAtZero: true }
                    },
                    plugins: { 
                        legend: { 
                            labels: { 
                                color: '#e7ecf3',
                                usePointStyle: true,
                                pointStyle: 'circle',
                                boxWidth: 8,
                                boxHeight: 8
                            } 
                        }
                    }
                };
            }

            function ensureChart(id, label, color) {
                if (charts[id]) return charts[id];
                const ctx = document.getElementById(id).getContext('2d');
                charts[id] = new Chart(ctx, {
                    type: 'line',
                    data: { labels: [], datasets: [{ label, data: [], borderColor: color, tension: 0.2, pointRadius: 0 }] },
                    options: chartOpts()
                });

                return charts[id];
            }

            function ensureMulti(id, defs) {
                if (charts[id]) return charts[id];
                const ctx = document.getElementById(id).getContext('2d');
                charts[id] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: defs.map(d => ({
                            label: d.label, data: [], borderColor: d.color, tension: 0.2, pointRadius: 0
                        }))
                    },
                    options: chartOpts()
                });

                return charts[id];
            }

            function applySeries(chart, seriesList) {
                // seriesList: [{label, values:[{t,v}]}] — align on first series timestamps
                if (!seriesList.length || !seriesList[0].values.length) return;
                const labels = seriesList[0].values.map(p => {
                    const d = new Date(p.t * 1000);
                    return d.toLocaleTimeString();
                });

                chart.data.labels = labels;
                seriesList.forEach((s, i) => {
                    if (!chart.data.datasets[i]) return;
                    const map = new Map(s.values.map(p => [p.t, p.v]));
                    chart.data.datasets[i].data = seriesList[0].values.map(p => map.has(p.t) ? map.get(p.t) : null);
                    if (s.label) chart.data.datasets[i].label = s.label;
                });
                chart.update();
            }

            async function promQuery(query, start, end, step) {
                const u = new URL('/api/v1/metrics/query_range', location.origin);
                u.searchParams.set('query', query);
                u.searchParams.set('start', String(start));
                u.searchParams.set('end', String(end));
                u.searchParams.set('step', step);
                const res = await fetch(u);
                const body = await res.json();
                if (!res.ok) throw new Error(body.error || res.statusText);

                return body.series || [];
            }

            function nodeFilter() {
                const n = document.getElementById('node').value;
                return n ? `,node_id="${n}"` : '';
            }

            function methodFilter() {
                const m = document.getElementById('method').value;
                return m ? `,method="${m}"` : '';
            }

            async function loadNodes() {
                const res = await fetch('/api/v1/components');
                const data = await res.json();
                const nodes = [...new Set((data.components || []).map(c => c.node_id).filter(Boolean))];
                const sel = document.getElementById('node');
                sel.innerHTML = nodes.map(n => `<option value="${n}">${n}</option>`).join('');
                if (!nodes.length) sel.innerHTML = '<option value="">—</option>';
            }

            async function loadStatus() {
                const el = document.getElementById('prom-status');
                try {
                    const res = await fetch('/api/v1/metrics/status');
                    const data = await res.json();
                    if (data.ok) {
                    el.textContent = 'Prometheus: ok';
                    el.className = 'status ok';
                    } else {
                    el.textContent = 'Prometheus: ' + (data.error || 'unavailable');
                    el.className = 'status err';
                    }
                } catch (e) {
                    el.textContent = 'Prometheus: ' + e.message;
                    el.className = 'status err';
                }
            }

            async function loadCharts() {
                const rangeSec = parseInt(document.getElementById('range').value, 10) || 3600;
                const end = Math.floor(Date.now() / 1000);
                const start = end - rangeSec;
                const step = rangeSec <= 900 ? '10s' : rangeSec <= 3600 ? '15s' : '30s';
                const nf = nodeFilter();
                const mf = methodFilter();

                try {
                    const rpsQ = `sum(rate(kvengine_request_count_total{${nf.replace(/^,/, '')}${mf}[1m]))`;
                    // fix empty label braces
                    const rpsQuery = buildRateQuery('kvengine_request_count_total', nf, mf);
                    const rps = await promQuery(rpsQuery, start, end, step);
                    applySeries(ensureChart('chart-rps', 'RPS', '#7eb8ff'), [{
                        label: 'RPS',
                        values: (rps[0] && rps[0].values) || []
                    }]);

                    const p50 = await promQuery(histQuantile(0.5, nf, mf), start, end, step);
                    const p95 = await promQuery(histQuantile(0.95, nf, mf), start, end, step);
                    const p99 = await promQuery(histQuantile(0.99, nf, mf), start, end, step);
                    applySeries(ensureMulti('chart-lat', [
                        { label: 'p50', color: '#3dd68c' },
                        { label: 'p95', color: '#ffcc66' },
                        { label: 'p99', color: '#f07178' }
                    ]), [
                        { label: 'p50', values: (p50[0] && p50[0].values) || [] },
                        { label: 'p95', values: (p95[0] && p95[0].values) || [] },
                        { label: 'p99', values: (p99[0] && p99[0].values) || [] }
                    ]);

                    const hits = await promQuery(rateQuery('kvengine_get_hits_total', nf), start, end, step);
                    const misses = await promQuery(rateQuery('kvengine_get_misses_total', nf), start, end, step);
                    applySeries(ensureMulti('chart-hit', [
                        { label: 'hit', color: '#3dd68c' },
                        { label: 'miss', color: '#f07178' }
                    ]), [
                        { label: 'hit', values: (hits[0] && hits[0].values) || [] },
                        { label: 'miss', values: (misses[0] && misses[0].values) || [] }
                    ]);

                    const off = await promQuery(gaugeQuery('kvengine_applied_offset_bytes', nf), start, end, step);
                    applySeries(ensureChart('chart-offset', 'offset', '#7eb8ff'), [
                        { values: (off[0] && off[0].values) || [] }
                    ]);

                    const ent = await promQuery(gaugeQuery('kvengine_entries_count', nf), start, end, step);
                    applySeries(ensureChart('chart-entries', 'entries', '#ffcc66'), [
                        { values: (ent[0] && ent[0].values) || [] }
                    ]);

                    const gor = await promQuery(gaugeQuery('go_goroutines', nf), start, end, step);
                    applySeries(ensureChart('chart-go', 'goroutines', '#c3a6ff'), [
                    {    values: (gor[0] && gor[0].values) || [] }
                    ]);

                    await loadStatus();
                } catch (e) {
                    console.error(e);
                    const el = document.getElementById('prom-status');
                    el.textContent = 'Prometheus: ' + e.message;
                    el.className = 'status err';
                    // charts keep last successful data
                }
            }

            function labelsFrom(nf, mf) {
                const parts = [];
                if (nf) parts.push(nf.replace(/^,/, ''));
                if (mf) parts.push(mf.replace(/^,/, ''));
                return parts.length ? '{' + parts.join(',') + '}' : '';
            }

            function rateQuery(name, nf, mf) {
                return `sum(rate(${name}${labelsFrom(nf, mf || '')}[1m]))`;
            }

            function buildRateQuery(name, nf, mf) {
                return rateQuery(name, nf, mf);
            }

            function gaugeQuery(name, nf) {
                return `${name}${labelsFrom(nf, '')}`;
            }

            function histQuantile(q, nf, mf) {
                const sel = labelsFrom(nf, mf);
                return `histogram_quantile(${q}, sum by (le) (rate(kvengine_request_duration_seconds_bucket${sel}[1m])))`;
            }

            document.getElementById('refresh').onclick = () => loadCharts();
            document.getElementById('node').onchange = () => loadCharts();
            document.getElementById('method').onchange = () => loadCharts();
            document.getElementById('range').onchange = () => loadCharts();

            (async function init() {
                ensureChart('chart-rps', 'RPS', '#7eb8ff');
                ensureMulti('chart-lat', [
                    { label: 'p50', color: '#3dd68c' },
                    { label: 'p95', color: '#ffcc66' },
                    { label: 'p99', color: '#f07178' }
                ]);
                ensureMulti('chart-hit', [
                    { label: 'hit', color: '#3dd68c' },
                    { label: 'miss', color: '#f07178' }
                ]);
                ensureChart('chart-offset', 'offset', '#7eb8ff');
                ensureChart('chart-entries', 'entries', '#ffcc66');
                ensureChart('chart-go', 'goroutines', '#c3a6ff');
                await loadNodes();
                await loadStatus();
                await loadCharts();
                setInterval(loadCharts, 15000);
            })();
        </script>
    </body>
</html>
