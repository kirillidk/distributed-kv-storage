syntax = "proto3";

package kv.v2;

option go_package = "github.com/kirillidk/distributed-kv-storage/api/gen/go/kv/v2;kvv2";

service KVService {
  rpc Set(SetRequest) returns (SetResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

message SetRequest {
  // Must not be empty
  bytes key = 1;

  // May be empty
  bytes value = 2;

  // Expiration in seconds. Zero means no expiration; values up to 30 days
  // are relative, while larger values are Unix timestamps
  uint64 ttl = 3;
}

message SetResponse {}

message GetRequest {
  // Must not be empty
  bytes key = 1;
}

message GetResponse {
  bytes value = 1;
}

message ApplyRequest {
  uint64 offset = 1;
  bytes payload = 2;
}

message ApplyResponse {}

message StatusRequest {}

message StatusResponse {
  uint64 offset = 1;
}