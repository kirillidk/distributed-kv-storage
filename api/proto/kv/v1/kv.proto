syntax = "proto3";

package kv.v1;

option go_package = "github.com/kirillidk/distributed-kv-storage/api/gen/go/kv/v1;kvv1";

service KVService {
  rpc Set(SetRequest) returns (SetResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Add(AddRequest) returns (AddResponse);
  rpc Replace(ReplaceRequest) returns (ReplaceResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc GetExpireTime(GetExpireTimeRequest) returns (GetExpireTimeResponse);
  rpc Incr(IncrRequest) returns (IncrResponse);
  rpc Decr(DecrRequest) returns (DecrResponse);
}

message SetRequest {
  // Must not be empty
  bytes key = 1;

  // May be empty
  bytes value = 2;

  // Expiration in seconds. Zero means no expiration; values up to 30 days
  // are relative, while larger values are Unix timestamps
  uint64 ttl = 3;
}

message SetResponse {}

message GetRequest {
  // Must not be empty
  bytes key = 1;
}

message GetResponse {
  bytes value = 1;

  // Absolute Unix timestamp in seconds. Zero means no expiration.
  uint64 expires_at = 2;
}

message AddRequest {
  // Must not be empty
  bytes key = 1;

  // May be empty
  bytes value = 2;

  // Expiration in seconds. Zero means no expiration; values up to 30 days
  // are relative, while larger values are Unix timestamps
  uint64 ttl = 3;
}

message AddResponse {
  bool success = 1;
}

message ReplaceRequest {
  // Must not be empty
  bytes key = 1;

  // May be empty
  bytes value = 2;

  // Expiration in seconds. Zero means no expiration; values up to 30 days
  // are relative, while larger values are Unix timestamps
  uint64 ttl = 3;
}

message ReplaceResponse {
  bool success = 1;
}

message DeleteRequest {
  // Must not be empty
  bytes key = 1;
}

message DeleteResponse {
  bool success = 1;
}

message GetExpireTimeRequest {
  // Must not be empty
  bytes key = 1;
}

message GetExpireTimeResponse {
  // Absolute Unix timestamp in seconds. Zero means no expiration.
  uint64 expires_at = 1;
}

message IncrRequest {
  // Must not be empty
  bytes key = 1;

  // Amount to increment by. Must be positive.
  uint64 delta = 2;
}

message IncrResponse {
  uint64 value = 1;
}

message DecrRequest {
  // Must not be empty
  bytes key = 1;

  // Amount to decrement by. Must be positive.
  uint64 delta = 2;
}

message DecrResponse {
  uint64 value = 1;
}
